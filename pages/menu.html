<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="/assets/css/menu.css">
</head>
<body class="menu-page">
  <div id="menu-wrapper">
    <div id="auth-buttons">
      <button id="login-button" style="display:none;">Se connecter</button>
      <button id="logout-button" style="display:none;">Se déconnecter</button>
    </div>

    <div class="menu-item">My Tours <span class="menu-icon">&gt;</span></div>
    <div class="menu-item">My Explanations <span class="menu-icon">&gt;</span></div>
    <div class="menu-item">Share the App <span class="menu-icon">&gt;</span></div>
    <div class="menu-item">Setup <span class="menu-icon">&gt;</span></div>
  </div>

  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      const auth0 = await window.auth0.createAuth0Client({
        domain: 'dev-1of24kih8koq07ek.us.auth0.com',
        clientId: 'OQ4bNWZZVJqn91glXQrYxWH6p50rB5NL',
        authorizationParams: {
          redirect_uri: window.location.origin + '/pages/menu.html'
        }
      });

      const loginBtn = document.getElementById("login-button");
      const logoutBtn = document.getElementById("logout-button");

      if (window.location.search.includes('code=') && window.location.search.includes('state=')) {
      const result = await auth0.handleRedirectCallback();
      const targetUrl = result.appState?.targetUrl || '/';
      window.history.replaceState({}, document.title, targetUrl);
      window.location.href = targetUrl;
    }


      const isAuthenticated = await auth0.isAuthenticated();

      if (isAuthenticated) {
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
      } else {
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
      }

      loginBtn.addEventListener("click", () => {
        auth0.loginWithRedirect({
          appState: { targetUrl: '/pages/menu.html' }
        });
      });

      logoutBtn.addEventListener("click", () => {
        auth0.logout({ returnTo: window.location.origin + '/pages/menu.html' });
      });
    });
  </script>

  <!-- Footer -->
  <div id="footer-placeholder"></div>
  <script src="/assets/js/utils.js"></script>
  <script>
    fetch("/assets/components/footer.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("footer-placeholder").innerHTML = data;
      });
  </script>
</body>
</html>
