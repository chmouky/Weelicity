<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Tours</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="shrikhand-text">My Tours</h1>

  <div id="tours-list" style="margin-top: 100px; padding: 20px;">
    <!-- Les tours seront injectés ici -->
  </div>


  <script>
    fetch("/assets/components/footer.html")
      .then(response => response.text())
      .then(data => {
        const footer = document.getElementById("footer-placeholder");
        footer.innerHTML = data;
        footer.classList.add("loaded");
      });
  
    // 👉 Ajouter l'action sur "My Tours"
    document.getElementById("my-tours-link").addEventListener("click", () => {
      window.location.href = "/pages/mytours.html"; // 📍 adapte le chemin selon ton dossier
    });
  </script>
  
  <script src="mytours.js"></script>

</body>
</html>
