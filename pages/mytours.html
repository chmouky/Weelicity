<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Tours</title>
  <link rel="stylesheet" href="/assets/css/style.css"> <!-- adapte le chemin si besoin -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&display=swap">
</head>
<body>

  <h1 class="shrikhand-text">My Tours</h1>

  <div id="tours-list" style="margin-top: 100px; padding: 20px;">
    <!-- Les tours seront injectés ici -->
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      firebase.auth().onAuthStateChanged(user => {
        if (user && !sessionStorage.getItem("user")) {
          console.log("📦 Session restaurée depuis Firebase (mytours).");
          sessionStorage.setItem("user", JSON.stringify({
            sub: user.uid,
            email: user.email,
            name: user.displayName,
            picture: user.photoURL
          }));
        }
      });
    });
  </script>
  
  <!-- 👉 uniquement ton script spécifique -->
  <script src="/assets/js/mytours.js"></script>

</body>
</html>
