<!doctype html>
<html lang="fr-FR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weelicity</title>

  <link rel="manifest" href="assets/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Weelicity">

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/index.css">
  <link rel="stylesheet" href="assets/css/footer.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter&family=Shrikhand">
</head>
<body>
  <!-- Bouton Login -->
  <button id="loginBtn" style="position: absolute; top: 10px; right: 10px; z-index: 9999;">
    Login
  </button>

  <!-- Overlay de chargement -->
  <div id="loadingOverlay" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: rgba(255, 255, 255, 0.8);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
  ">
    <img src="assets/img/index/pin_wait.gif" alt="Chargement..." style="width: 120px; height: auto;">
  </div>

  <div id="siteWrapper">
    <header><h1></h1></header>

    <main id="page" class="container">
      <section>
        <div class="content">
          <img src="assets/img/pages/Home.jpg" alt="Accueil de Weelicity">
        </div>
      </section>
    </main>
  </div>

  <!-- Footer (chargé dynamiquement sauf sur index) -->
  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script>
    window.loadAuth0Script = function(attempt = 1, maxAttempts = 3) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js";
        script.async = true;
        script.onload = () => {
          if (window.createAuth0Client) {
            console.log("✅ Auth0 SPA JS library loaded from CDN");
            resolve();
          } else {
            console.error("❌ Auth0 SPA JS library loaded from CDN but createAuth0Client is undefined");
            reject(new Error("Auth0 SPA JS library loaded but createAuth0Client is undefined"));
          }
        };
        script.onerror = () => {
          if (attempt < maxAttempts) {
            console.warn(`⚠️ Failed to load Auth0 SPA JS from CDN (attempt ${attempt}/${maxAttempts}), retrying...`);
            setTimeout(() => {
              window.loadAuth0Script(attempt + 1, maxAttempts).then(resolve).catch(reject);
            }, 1000);
          } else {
            console.warn("⚠️ Failed to load Auth0 SPA JS from CDN after all attempts, trying local fallback");
            const fallbackScript = document.createElement("script");
            fallbackScript.src = "/assets/js/auth0-spa-js.min.js";
            fallbackScript.async = true;
            fallbackScript.onload = () => {
              if (window.createAuth0Client) {
                console.log("✅ Auth0 SPA JS library loaded from local fallback");
                resolve();
              } else {
                console.error("❌ Auth0 SPA JS library loaded from local fallback but createAuth0Client is undefined");
                reject(new Error("Auth0 SPA JS library loaded from local fallback but createAuth0Client is undefined"));
              }
            };
            fallbackScript.onerror = () => {
              console.error("❌ Failed to load Auth0 SPA JS from both CDN and local fallback");
              reject(new Error("Auth0 SPA JS library not loaded"));
            };
            document.head.appendChild(fallbackScript);
          }
        };
        document.head.appendChild(script);

        setTimeout(() => {
          if (!window.createAuth0Client) {
            reject(new Error("Auth0 SPA JS library failed to load within 5 seconds"));
          }
        }, 5000);
      });
    };
  </script>
  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/utils.js" defer></script>
  <script type="module" src="assets/js/index.js"></script>

  <script>
    const isIndexPage = location.pathname.endsWith("index.html") || location.pathname === "/";
    if (!isIndexPage) {
      fetch("assets/components/footer.html")
        .then(response => response.text())
        .then(data => {
          const footer = document.getElementById("footer-placeholder");
          footer.innerHTML = data;
          footer.classList.add("loaded");
        });
    } 
  </script>
</body>
</html>
