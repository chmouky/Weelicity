<html lang="fr-FR">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Weelicity">

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/index.css">
  <link rel="stylesheet" href="assets/css/footer.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter&family=Shrikhand">
</head>
<body>
  <!-- Bouton Login -->

  <button id="logoutBtn" style="position: absolute; top: 50px; right: 10px; z-index: 9999; display: none;">
    Logout
  </button>
  
  <!-- Pour afficher le nom -->
  <div id="userInfo" style="position: absolute; top: 90px; right: 10px; z-index: 9999; font-size: 14px;"></div>
  
  <!-- Overlay de chargement -->
  <div id="loadingOverlay" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: rgba(255, 255, 255, 0.8);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
  ">
    <img src="assets/img/index/pin_wait.gif" alt="Chargement..." style="width: 120px; height: auto;">
  </div>

  <div id="siteWrapper">
    <header><h1></h1></header>

    <main id="page" class="container">
      <section>
        <div class="content">
          <img src="assets/img/pages/Home.jpg" alt="Accueil de Weelicity">
        </div>
      </section>
    </main>
  </div>

  <!-- Footer (chargé dynamiquement sauf sur index) -->
  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script>
    
  </script>
  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/utils.js" defer></script>
  <script type="module" src="assets/js/index.js"></script>

  <script>
    <script>
  const isIndexPage = location.pathname.endsWith("index.html") || location.pathname === "/";
  
  firebase.auth().onAuthStateChanged((user) => {
    if (!isIndexPage || user) {
      fetch("/assets/components/footer.html")
        .then(response => response.text())
        .then(data => {
          const footer = document.getElementById("footer-placeholder");
          footer.innerHTML = data;
          footer.classList.add("loaded");
        });
    }
  });

</script>

  </script>

  <!-- Formulaire d'authentification -->
  <!-- Formulaire d'authentification avec design amélioré -->
<div id="authContainer" style="
  position: absolute;
  top: 20px;
  left: 20px;
  z-index: 9999;
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  width: 280px;
  font-family: Arial, sans-serif;
">
  <form id="authForm" style="display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; gap: 8px;">
      <input type="email" id="emailInput" placeholder="Email" required style="flex: 1; padding: 8px; font-size: 14px;">
      <button type="submit" id="loginBtnSubmit" style="padding: 8px 14px; font-size: 14px;">Login</button>
    </div>
    <input type="password" id="passwordInput" placeholder="Mot de passe" required style="padding: 8px; font-size: 14px;">
    <button type="button" id="signupBtn" style="font-size: 13px; padding: 6px 12px;">Créer un compte</button>
    <a href="#" id="resetPasswordLink" style="font-size: 12px; text-align: left;">Mot de passe oublié ?</a>
  </form>
</div>

<!-- Bouton Logout -->
<button id="logoutBtn" style="
  display: none;
  position: absolute;
  top: 20px;
  left: 20px;
  z-index: 9999;
  padding: 10px 20px;
  border-radius: 8px;
  background: #f44336;
  color: white;
  border: none;
  font-size: 14px;
  cursor: pointer;
">Déconnexion</button>

<!-- Info utilisateur connecté -->
<div id="userInfo" style="position: absolute; top: 70px; left: 20px; z-index: 9999; font-size: 14px;"></div>

<!-- Toast notification -->
<div id="toast" style="
  display: none;
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #4caf50;
  color: white;
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 14px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  z-index: 99999;
"></div>


<!-- Bouton Logout (caché au départ) -->
<button id="logoutBtn" style="display: none; position: absolute; top: 10px; right: 10px; z-index: 9999;">
  Logout
</button>

<div id="userInfo" style="position: absolute; top: 60px; right: 10px; z-index: 9999; font-size: 14px;"></div>
