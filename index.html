<!doctype html>
<html lang="fr-FR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weelicity</title>

  <link rel="manifest" href="assets/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Weelicity">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/index.css">
  <link rel="stylesheet" href="assets/css/footer.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter&family=Shrikhand">
</head>
<body>
  <!-- Overlay de chargement -->
  <div id="loadingOverlay" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: rgba(255, 255, 255, 0.8);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
  ">
    <img src="assets/img/index/pin_wait.gif" alt="Chargement..." style="width: 120px; height: auto;">
  </div>

  <div id="siteWrapper">
    <header><h1></h1></header>

    <main id="page" class="container">
      <section>
        <div class="content">
          <img src="assets/img/pages/Home.jpg" alt="Accueil de Weelicity">
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>
  </div>

  <!-- Footer -->
  <script>
    fetch("assets/components/footer.html")
      .then(res => res.text())
      .then(html => {
        document.getElementById("footer-placeholder").innerHTML = html;
      });
  </script>

  <!-- Scripts -->
  <script src="/assets/js/utils.js"></script>
  <script type="module" src="/assets/js/index.js"></script>
</body>
</html>
