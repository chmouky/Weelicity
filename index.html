<!doctype html>
<html lang="fr-FR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weelicity</title>

  <link rel="manifest" href="assets/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Weelicity">

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/index.css">
  <link rel="stylesheet" href="assets/css/footer.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter&family=Shrikhand">
</head>
<body>
  <!-- Bouton Login -->
  <button id="loginBtn" style="position: absolute; top: 10px; right: 10px; z-index: 9999;">
    Login
  </button>
  <button id="logoutBtn" style="position: absolute; top: 50px; right: 10px; z-index: 9999; display: none;">
    Logout
  </button>
  
  <!-- Pour afficher le nom -->
  <div id="userInfo" style="position: absolute; top: 90px; right: 10px; z-index: 9999; font-size: 14px;"></div>
  
  <!-- Overlay de chargement -->
  <div id="loadingOverlay" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: rgba(255, 255, 255, 0.8);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
  ">
    <img src="assets/img/index/pin_wait.gif" alt="Chargement..." style="width: 120px; height: auto;">
  </div>

  <div id="siteWrapper">
    <header><h1></h1></header>

    <main id="page" class="container">
      <section>
        <div class="content">
          <img src="assets/img/pages/Home.jpg" alt="Accueil de Weelicity">
        </div>
      </section>
    </main>
  </div>

  <!-- Footer (chargé dynamiquement sauf sur index) -->
  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script>
    
  </script>
  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/utils.js" defer></script>
  <script type="module" src="assets/js/index.js"></script>

  <script>
    <script>
  const isIndexPage = location.pathname.endsWith("index.html") || location.pathname === "/";
  
  firebase.auth().onAuthStateChanged((user) => {
    if (!isIndexPage || user) {
      fetch("assets/components/footer.html")
        .then(response => response.text())
        .then(data => {
          const footer = document.getElementById("footer-placeholder");
          footer.innerHTML = data;
          footer.classList.add("loaded");
        });
    }
  });
</script>

  </script>

<form id="authForm" style="position: absolute; top: 140px; right: 10px; z-index: 9999; font-size: 14px;">
  <input type="email" id="emailInput" placeholder="Email" required><br>
  <input type="password" id="passwordInput" placeholder="Mot de passe" required><br>
  <button type="submit" id="loginBtnSubmit">Se connecter</button>
  <button type="button" id="signupBtn">Créer un compte</button>
</form>

</body>
</html>
